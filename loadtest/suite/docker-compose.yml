# Services for suite tests that need real databases (t4). Started by src/suite/runner.ts.
name: relay-suite
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory', '-sharedDb']
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      # The image has no curl/wget; probe the port with bash's /dev/tcp.
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8000" || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: ${RELAY_PG_PASSWORD:-relay}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55432:5432'
    command: ['postgres', '-c', 'fsync=off', '-c', 'max_connections=300']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 30
