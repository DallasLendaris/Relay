# Records the live NWS California alerts feed (and the zone shapes its alerts need) into
# backend/dev-data/replay/, for replay mode and `npm run simulate`.
#
# Run it from the Actions tab ("Capture NWS feed" > Run workflow) on any branch. On a branch other
# than main it commits the recording back to that branch; on main (protected) it only uploads the
# recording as a workflow artifact for you to commit through a pull request.
name: Capture NWS feed

on:
  workflow_dispatch:
    inputs:
      captures:
        description: 'How many recordings to make, 5 minutes apart (1-6)'
        default: '1'
  push:
    branches: [poc-v1-submission]
    paths: ['.github/workflows/capture-nws.yml']

permissions:
  contents: read

concurrency:
  group: capture-nws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record the feed
        env:
          CAPTURES: ${{ github.event.inputs.captures || '1' }}
          NWS_CONTACT: github.com/${{ github.repository }}
        run: |
          n=$(( CAPTURES < 1 ? 1 : (CAPTURES > 6 ? 6 : CAPTURES) ))
          for i in $(seq 1 "$n"); do
            npm run capture-nws -w @relay/backend
            if [ "$i" -lt "$n" ]; then sleep 300; fi
          done
      - name: Check the recordings ingest cleanly
        run: |
          npm run build:shared
          cd backend && npx vitest run test/local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nws-recordings
          path: backend/dev-data/replay/recorded-*
      - name: Commit the recordings to this branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/dev-data/replay/recorded-*
          git commit -m "Record live NWS California feed ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
