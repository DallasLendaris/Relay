name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @relay/shared points at dist/ (gitignored), so build it before anything imports it.
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
