name: CI

on:
  pull_request:
  push:
    branches: [main]

# DEP-4 / SEC-C-10: least privilege by default; a job asks for more only when it needs it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved). Dependabot bumps both the
      # SHA and the comment; see .github/dependabot.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @relay/shared points at dist/ (gitignored), so build it before anything imports it.
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
