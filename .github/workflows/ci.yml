name: CI

on:
  pull_request:
  push:
    branches: [main]

# DEP-4 / SEC-C-10: least privilege by default; a job asks for more only when it needs it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved). Dependabot bumps both the
      # SHA and the comment; see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @relay/shared points at dist/ (gitignored), so build it before anything imports it.
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
