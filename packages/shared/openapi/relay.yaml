openapi: 3.1.0
info:
  title: Relay API (demo)
  version: 0.1.0
  description: |
    Source of truth for the Relay demo API. TypeScript types are generated from
    this file (`npm run generate`). Format changes need approval from all three teammates.
servers:
  - url: https://api.relay.example.com
    description: Placeholder; replaced by the deployed API Gateway URL

security: []

tags:
  - name: devices
  - name: places
  - name: alerts
  - name: checkins
  - name: agency

paths:
  /devices:
    post:
      tags: [devices]
      operationId: createDevice
      summary: Register an anonymous device. No auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /devices/me/push-token:
    put:
      tags: [devices]
      operationId: setPushToken
      summary: Store this device's push target and preferred language.
      description: |
        Send either the legacy body (expoPushToken) or the native body (platform and token).
        A token held by another device moves to this one.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
      responses:
        '204':
          description: Saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/me:
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Permanently erase this device and all of its data.
      description: |
        Deletes the device's places, its alert-matching index entries and every check-in it
        made, and records that the device is gone so its credential is rejected afterwards
        (a deleted device can no longer check in). This cannot be undone. Calling it again
        with the same credential after a partial failure finishes the erasure.
      security:
        - deviceAuth: []
      responses:
        '204':
          description: Erased
        '401':
          $ref: '#/components/responses/Unauthorized'

  /places:
    post:
      tags: [places]
      operationId: createPlace
      summary: Save a place by address or by coordinates.
      description: |
        California only, at most 5 places per device.
        Returns 409 when the device already has 5 places and 422 when the
        location is outside California.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaceRequest'
      responses:
        '201':
          description: Place saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The device already has the maximum of 5 places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The location is outside California
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [places]
      operationId: listPlaces
      summary: List this device's saved places.
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Saved places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /places/{placeId}:
    delete:
      tags: [places]
      operationId: deletePlace
      summary: Delete a saved place.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: Active alerts that match this device's saved places.
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Active alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/{alertId}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Full alert.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /alerts/{alertId}/checkins:
    post:
      tags: [checkins]
      operationId: createCheckIn
      summary: Record an "I'm okay" check-in for an alert.
      description: |
        `token` is the signed check-in token delivered in the push notification.
        A device checks in at most once per alert, and only its first check-in counts toward
        the totals. Any later request from the same device for the same alert returns 200 with
        the original `checkedInAt`, whatever `idempotencyKey` it sends. `idempotencyKey` is
        required so a client can safely retry; the server does not use it for uniqueness.
        `need_help` is reserved for the Pilot; the demo API rejects it with 400.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckInRequest'
      responses:
        '200':
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The token is not valid for this device and alert (`invalid_token`), or none of the
            device's saved places is in the alert area (`not_in_area`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /agency/alerts:
    get:
      tags: [agency]
      operationId: listAgencyAlerts
      summary: Alerts for the signed-in agency's county.
      security:
        - agencyAuth: []
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agency/alerts/{alertId}/response:
    get:
      tags: [agency]
      operationId: getAgencyAlertResponse
      summary: Anonymous per-H3-cell check-in totals.
      description: 'Cells with fewer than minimumCellSize recipients are returned with hidden set to true and zeroed counts.'
      security:
        - agencyAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Response totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyAlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      description: The device credential returned by POST /devices.
    agencyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito-issued JWT for an agency user.

  parameters:
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. place_limit_reached
        message:
          type: string

    CreateDeviceRequest:
      type: object
      description: Empty object. Devices are anonymous.
      additionalProperties: false

    CreateDeviceResponse:
      type: object
      required: [deviceId, credential]
      properties:
        deviceId:
          type: string
          format: uuid
        credential:
          type: string
          description: Secret bearer credential. Store in secure storage; shown only once.
        fcmProject:
          type: string
          description: |
            Android only. The Firebase project this device's app must register its FCM token
            with (initialize a secondary FirebaseApp for it when it is not the default project).
            Send it back as fcmProject with the token in PUT /devices/me/push-token. Absent when
            the server uses a single Firebase project.

    PushTokenRequest:
      oneOf:
        - $ref: '#/components/schemas/ExpoPushTokenRequest'
        - $ref: '#/components/schemas/NativePushTokenRequest'

    ExpoPushTokenRequest:
      type: object
      required: [expoPushToken, language]
      properties:
        expoPushToken:
          type: string
          maxLength: 200
        language:
          type: string
          enum: [en, es]

    NativePushTokenRequest:
      type: object
      required: [platform, token, language]
      properties:
        platform:
          type: string
          enum: [ios, android, expo]
        token:
          type: string
          minLength: 64
          maxLength: 4096
          description: |
            ios: APNs device token, 64 to 200 hex characters.
            android: FCM registration token, 100 to 4096 characters of A-Z a-z 0-9 _ : -.
            expo: ExponentPushToken[...].
        fcmProject:
          type: string
          description: |
            Android only. The Firebase project the FCM token was registered with, as returned
            by POST /devices. Must be one of the server's configured projects, otherwise 400.
            Omit it when the app registered with the default (first) project.
        language:
          type: string
          enum: [en, es]

    CreatePlaceByAddress:
      type: object
      required: [label, address]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          description: |
            A short, generic name such as Home, Work or School. Do not put an address or a
            person's name in it.
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: Free-text address, at most 200 characters, no control characters.

    CreatePlaceByCoordinates:
      type: object
      required: [label, latitude, longitude]
      description: |
        The coordinates are used once to find the H3 cell and are not stored.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          description: A short, generic name such as Home, Work or School.
        latitude:
          type: number
        longitude:
          type: number

    CreatePlaceRequest:
      description: Either an address or coordinates.
      oneOf:
        - $ref: '#/components/schemas/CreatePlaceByAddress'
        - $ref: '#/components/schemas/CreatePlaceByCoordinates'

    Place:
      type: object
      required: [id, label, h3Cell, createdAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 60
        shortAddress:
          type: string
          description: |
            Street-level address without the house number, for display. Absent for a place
            saved by coordinates (nothing but the H3 cell is kept for those).
        h3Cell:
          type: string
          description: H3 cell at resolution 7.
        createdAt:
          type: string
          format: date-time

    PlaceList:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'

    AlertSummary:
      type: object
      required: [id, event, relaySeverity, state, expires, headline, matchedPlaceIds]
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
        relaySeverity:
          $ref: '#/components/schemas/RelaySeverity'
        state:
          $ref: '#/components/schemas/AlertState'
        expires:
          type: string
          format: date-time
        headline:
          type: [string, 'null']
        matchedPlaceIds:
          type: array
          items:
            type: string
            format: uuid

    AlertSummaryList:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummary'

    CreateCheckInRequest:
      type: object
      required: [status, token, idempotencyKey]
      properties:
        status:
          $ref: '#/components/schemas/CheckInStatus'
        token:
          type: string
          maxLength: 1024
        idempotencyKey:
          type: string
          maxLength: 200

    CreateCheckInResponse:
      type: object
      required: [checkedInAt]
      properties:
        checkedInAt:
          type: string
          format: date-time

    AgencyAlertResponse:
      type: object
      required: [alertId, asOf, minimumCellSize, cells]
      properties:
        alertId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        minimumCellSize:
          type: integer
          const: 20
        cells:
          type: array
          items:
            $ref: '#/components/schemas/AgencyCell'

    AgencyCell:
      type: object
      required: [h3Cell, recipients, checkedIn, hidden]
      properties:
        h3Cell:
          type: string
        recipients:
          type: integer
          minimum: 0
        checkedIn:
          type: integer
          minimum: 0
        hidden:
          type: boolean
          description: True when the cell has fewer than minimumCellSize recipients.

    RelaySeverity:
      type: string
      enum: [emergency, warning, watch, advisory, statement]

    AlertState:
      type: string
      enum: [active, updated, cancelled, expired]

    CheckInStatus:
      type: string
      enum: [ok, need_help]
      description: |
        `need_help` is reserved for the Pilot. The demo API rejects it.

    GeoPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number

    GeoMultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number

    AlertReference:
      type: object
      required: [sourceId, sent]
      properties:
        sourceId:
          type: string
        sent:
          type: string
          format: date-time

    AlertArea:
      type: object
      required: [description, geometry, ugcCodes, sameCodes, h3Cells]
      properties:
        description:
          type: string
        geometry:
          description: GeoJSON Polygon or MultiPolygon; null when NWS gives only zone codes.
          oneOf:
            - $ref: '#/components/schemas/GeoPolygon'
            - $ref: '#/components/schemas/GeoMultiPolygon'
            - type: 'null'
        ugcCodes:
          type: array
          items:
            type: string
        sameCodes:
          type: array
          items:
            type: string
        h3Cells:
          type: array
          items:
            type: string

    AlertOfficial:
      type: object
      description: Text exactly as published by the source agency.
      required: [headline, description, instruction, senderName, language]
      properties:
        headline:
          type: [string, 'null']
        description:
          type: string
        instruction:
          type: [string, 'null']
        senderName:
          type: string
        language:
          type: string

    AlertSummaryText:
      type: object
      description: A plain-language summary written by Relay (not by the agency). Must be labeled as a Relay summary in the UI.
      required: [language, whatToDo, text]
      properties:
        language:
          type: string
        whatToDo:
          type: string
        text:
          type: string

    Alert:
      type: object
      required:
        - id
        - source
        - sourceId
        - event
        - eventCode
        - relaySeverity
        - capSeverity
        - urgency
        - certainty
        - status
        - messageType
        - state
        - references
        - area
        - sent
        - effective
        - onset
        - expires
        - ends
        - official
        - summaries
        - signature
      properties:
        id:
          type: string
          format: uuid
          description: Relay's own id.
        source:
          type: string
          enum: [nws, usgs, ipaws]
        sourceId:
          type: string
          description: NWS id URN.
        event:
          type: string
          description: e.g. Flash Flood Warning
        eventCode:
          type: [string, 'null']
          description: NWS/SAME event code.
        relaySeverity:
          $ref: '#/components/schemas/RelaySeverity'
        capSeverity:
          type: string
          enum: [Extreme, Severe, Moderate, Minor, Unknown]
        urgency:
          type: string
          enum: [Immediate, Expected, Future, Past, Unknown]
        certainty:
          type: string
          enum: [Observed, Likely, Possible, Unlikely, Unknown]
        status:
          type: string
          enum: [Actual, Exercise, System, Test, Draft]
        messageType:
          type: string
          enum: [Alert, Update, Cancel, Ack, Error]
        state:
          $ref: '#/components/schemas/AlertState'
        references:
          type: array
          items:
            $ref: '#/components/schemas/AlertReference'
        area:
          $ref: '#/components/schemas/AlertArea'
        sent:
          type: string
          format: date-time
        effective:
          type: string
          format: date-time
        onset:
          type: [string, 'null']
          format: date-time
        expires:
          type: string
          format: date-time
        ends:
          type: [string, 'null']
          format: date-time
        official:
          $ref: '#/components/schemas/AlertOfficial'
        summaries:
          type: array
          description: Relay summaries; may be empty.
          items:
            $ref: '#/components/schemas/AlertSummaryText'
        signature:
          type: [string, 'null']
          description: Set once Relay validates the alert signature.
        pds:
          type: boolean
          description: >-
            True for a particularly dangerous situation (NWS damage threat CONSIDERABLE on a
            Tornado or Flash Flood Warning). The tier stays warning. Omitted when not applicable.

    PublicAlertDocument:
      type: object
      description: |
        Cell-free document for one alert version, served by the CDN at
        `{cdnBase}/alerts/v1/doc/{alertId}/{hash}.json` and immutable (cached for a year; the URL
        changes whenever the alert changes). It has everything the app shows and not the H3 cell
        list. `signature` is the alert's own signature over the full alert; `area.cellsSha256` and
        `area.cellCount` bind this document to those cells. A phone cannot verify the signature
        (it is symmetric); it trusts the document because it came from the Relay CDN over TLS.
      additionalProperties: false
      required:
        - version
        - id
        - source
        - sourceId
        - event
        - eventCode
        - relaySeverity
        - capSeverity
        - urgency
        - certainty
        - status
        - messageType
        - state
        - references
        - area
        - sent
        - effective
        - onset
        - expires
        - ends
        - official
        - summaries
        - signature
      properties:
        version:
          type: integer
          const: 1
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [nws, usgs, ipaws]
        sourceId:
          type: string
        event:
          type: string
        eventCode:
          type: [string, 'null']
        relaySeverity:
          $ref: '#/components/schemas/RelaySeverity'
        capSeverity:
          type: string
          enum: [Extreme, Severe, Moderate, Minor, Unknown]
        urgency:
          type: string
          enum: [Immediate, Expected, Future, Past, Unknown]
        certainty:
          type: string
          enum: [Observed, Likely, Possible, Unlikely, Unknown]
        status:
          type: string
          enum: [Actual, Exercise, System, Test, Draft]
        messageType:
          type: string
          enum: [Alert, Update, Cancel, Ack, Error]
        state:
          $ref: '#/components/schemas/AlertState'
        references:
          type: array
          items:
            $ref: '#/components/schemas/AlertReference'
        area:
          type: object
          additionalProperties: false
          required: [description, cellCount, cellsSha256]
          properties:
            description:
              type: string
            cellCount:
              type: integer
              minimum: 0
            cellsSha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
        sent:
          type: string
          format: date-time
        effective:
          type: string
          format: date-time
        onset:
          type: [string, 'null']
          format: date-time
        expires:
          type: string
          format: date-time
        ends:
          type: [string, 'null']
          format: date-time
        official:
          $ref: '#/components/schemas/AlertOfficial'
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummaryText'
        signature:
          type: [string, 'null']
        pds:
          type: boolean

    AlertPointer:
      type: object
      description: |
        Short-TTL pointer served at `{cdnBase}/alerts/v1/latest/{alertId}.json`
        (`Cache-Control: public, max-age=15, stale-while-revalidate=60`). It names the current
        document of an alert. A document is never changed after it is written, so an update or
        cancellation is seen only through this pointer, at most 75 seconds (15 s max-age plus 60 s
        stale-while-revalidate) after it is published. Phones that opened a document from a push
        should re-read the pointer when they show the alert.
      additionalProperties: false
      required: [version, alertId, sourceId, state, expires, doc]
      properties:
        version:
          type: integer
          const: 1
        alertId:
          type: string
          format: uuid
        sourceId:
          type: string
        state:
          $ref: '#/components/schemas/AlertState'
        expires:
          type: string
          format: date-time
        doc:
          type: string
          pattern: '^/alerts/v1/doc/'
          description: Path, relative to the CDN base URL, of the current PublicAlertDocument.

    PushData:
      type: object
      description: |
        The `data` map of an alert push notification (all values are strings). Not an HTTP
        payload; documented here because the app reads it. Required keys survive payload trimming;
        `alertUrl` may be dropped to fit the 4 KB APNs limit.
      additionalProperties: true
      required: [alertId, checkInToken, expiresAt]
      properties:
        alertId:
          type: string
          format: uuid
        checkInToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        alertUrl:
          type: string
          format: uri
          description: |
            Absolute CDN URL of this alert's PublicAlertDocument. Open it instead of calling the
            API. A 404 means the publish has not landed yet: retry once after a few seconds, then
            fall back to GET /alerts/{alertId}. Absent when the sender has no CDN base configured.

    CheckIn:
      type: object
      required: [alertId, deviceId, status, checkedInAt, token, idempotencyKey, h3Cell]
      properties:
        alertId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CheckInStatus'
        checkedInAt:
          type: string
          format: date-time
        token:
          type: string
          maxLength: 1024
        idempotencyKey:
          type: string
          maxLength: 200
        h3Cell:
          type: string
